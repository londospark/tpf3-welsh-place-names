<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3ea"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f9e44"/>
      <stop offset="100%" stop-color="#237a34"/>
    </linearGradient>
  </defs>

  <!-- Welsh flag halves -->
  <rect x="0" y="0" width="1920" height="540" fill="url(#sky)"/>
  <rect x="0" y="540" width="1920" height="540" fill="url(#grass)"/>

  <!-- distant hills -->
  <path d="M0,560 Q300,470 640,545 T1280,530 T1920,560 L1920,600 L0,600 Z" fill="#1f6a2c" opacity="0.55"/>

  <!-- rail track curving across the middle -->
  <path d="M-40,760 C420,620 900,900 1400,700 C1650,600 1820,660 1960,610"
        fill="none" stroke="#5a4632" stroke-width="14" opacity="0.9"/>
  <path d="M-40,760 C420,620 900,900 1400,700 C1650,600 1820,660 1960,610"
        fill="none" stroke="#dad2c2" stroke-width="4" stroke-dasharray="26 22" opacity="0.9"/>

  <!-- Y Ddraig Goch, simplified head-and-neck emblem (deliberately simpler
       than a full-body dragon, for a clean silhouette at small sizes) -->
  <g transform="translate(960,470)">
    <!-- neck, rising and curving right into the head -->
    <path d="M-70,230
             C-130,150 -140,40 -95,-60
             C-60,-135 20,-190 110,-195
             C160,-198 205,-180 230,-145
             C210,-155 180,-158 150,-150
             C195,-135 225,-100 230,-60
             L195,-65
             C205,-35 195,-5 165,15
             C160,-15 140,-38 110,-45
             C130,-20 130,15 105,40
             C95,15 75,-2 50,-8
             C60,15 55,42 35,60
             C-10,90 -45,155 -40,225 Z"
          fill="#c8102e" stroke="#7a0a1c" stroke-width="7" stroke-linejoin="round"/>
    <!-- head -->
    <path d="M195,-160
             C235,-175 275,-160 290,-125
             C300,-100 295,-72 275,-52
             C285,-30 275,-5 250,10
             C255,25 245,42 225,45
             C185,52 150,30 140,-8
             C130,-45 150,-90 190,-115
             Z"
          fill="#c8102e" stroke="#7a0a1c" stroke-width="7" stroke-linejoin="round"/>
    <!-- jaw / open mouth -->
    <path d="M275,-52 C300,-45 320,-25 315,0 C295,-5 275,-20 265,-40 Z"
          fill="#c8102e" stroke="#7a0a1c" stroke-width="7" stroke-linejoin="round"/>
    <!-- tongue -->
    <path d="M295,-8 C320,-2 340,10 335,25 C315,18 300,5 292,-6 Z" fill="#1a1a1a"/>
    <!-- eye -->
    <circle cx="235" cy="-105" r="11" fill="#fff"/>
    <circle cx="238" cy="-105" r="5.5" fill="#1a1a1a"/>
    <!-- back spikes -->
    <path d="M-70,-40 L-95,-85 L-55,-70 L-70,-115 L-25,-95 L-35,-140 L10,-115"
          fill="none" stroke="#7a0a1c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- foreleg -->
    <path d="M-30,150 C-10,185 25,198 60,185 L52,168 C25,180 0,168 -12,140 Z"
          fill="#c8102e" stroke="#7a0a1c" stroke-width="7" stroke-linejoin="round"/>
    <!-- claws -->
    <path d="M50,180 L68,170 M55,188 L75,183 M45,192 L58,202" stroke="#7a0a1c" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- simple locomotive silhouette, small, crossing the track lower-left -->
  <g transform="translate(230,745)" fill="#2b2b2b">
    <rect x="0" y="-46" width="150" height="46" rx="6"/>
    <rect x="18" y="-78" width="60" height="34" rx="4"/>
    <circle cx="130" cy="-90" r="10"/>
    <rect x="122" y="-96" width="16" height="10"/>
    <circle cx="26" cy="4" r="18"/>
    <circle cx="76" cy="4" r="18"/>
    <circle cx="126" cy="4" r="18"/>
  </g>

  <!-- title -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="960" y="920" font-size="108" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" paint-order="stroke">Welsh Place Names</text>
    <text x="960" y="990" font-size="42" fill="#f4e6c1" stroke="#1a1a1a" stroke-width="1.5" paint-order="stroke" font-style="italic">A Transport Fever 3 name-set mod</text>
  </g>
</svg>
